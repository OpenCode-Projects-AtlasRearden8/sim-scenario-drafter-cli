[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-scenario-drafter"
version = "0.1.0"
description = "Education-only CLI that drafts nursing simulation practice scenario packets (training material, never medical advice)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Dylan Asdale" }]
keywords = ["nursing", "simulation", "education", "openai", "ollama", "cli", "training"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
simscenario = "simscenario.cli:main"

[tool.setuptools]
packages = ["simscenario"]
